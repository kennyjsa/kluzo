<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: {{d.srcColor}}">{{d.src}}</span>

<p style="margin: 0; font-size: 12px; color: #A3ACBA; text-align: center">Todas as decisões vão para o relatório do MR milestone → main.</p>

<button type="button" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 16px; border: none; background: none; color: #A3ACBA; font: 500 11px Inter, sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>Mais</span></button>
