<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Kluzo · Progresso em kanban</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1014}
a{color:#5EEAD4}a:hover{color:#99F6E4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1014; color: #E7EAF0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<header style="padding: 16px 20px 8px; display: flex; flex-direction: column; gap: 4px">
<a href="Workspace.dc.html" style="font-size: 14px; text-decoration: none; min-height: 32px; display: flex; align-items: center">‹ v2.0 · Agendamento</a>
<h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Progresso</h1>
</header>
<div style="display: flex; gap: 8px; align-items: center; padding: 4px 16px 10px">
<div role="tablist" style="display: flex; gap: 4px; padding: 4px; background: #161A21; border: 1px solid #2A313D; border-radius: 12px">
<a href="Grafo.dc.html" role="tab" style="height: 34px; padding: 0 12px; border-radius: 9px; display: flex; align-items: center; color: #A3ACBA; font-size: 13px; font-weight: 500; text-decoration: none">Grafo</a>
<button type="button" role="tab" aria-selected="true" style="height: 34px; padding: 0 12px; border-radius: 9px; border: none; background: #2A313D; color: #E7EAF0; font: 600 13px Inter, sans-serif">Kanban</button>
<a href="Estrutura.dc.html" role="tab" style="height: 34px; padding: 0 12px; border-radius: 9px; display: flex; align-items: center; color: #A3ACBA; font-size: 13px; font-weight: 500; text-decoration: none">Estrutura</a>
</div>
<span style="font-size: 11px; color: #A3ACBA">só leitura</span>
</div>
<div role="tablist" aria-label="Colunas" style="display: flex; gap: 6px; padding: 0 16px 12px; overflow-x: auto">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="6">
<button type="button" role="tab" onClick="{{c.pick}}" style="flex: none; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: 600 13px Inter, sans-serif">{{c.name}} {{c.count}}</button>
</sc-for>
</div>
<a href="Escalacao.dc.html" style="margin: 0 16px 10px; background: #2A1C10; border: 1px solid #5A3A1E; border-radius: 12px; padding: 10px 12px; font-size: 13px; color: #FDBA74; text-decoration: none; display: flex; justify-content: space-between; align-items: center; min-height: 24px"><span>▲ 1 bloqueado · #46 aguarda sua resposta</span><span>›</span></a>
<main style="flex: 1; overflow-y: auto; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px dashed #2A313D; border-radius: 14px; padding: 24px; text-align: center; font-size: 14px; color: #A3ACBA">Nenhum nó nesta coluna agora.</div>
</sc-if>
<sc-for list="{{cards}}" as="k" hint-placeholder-count="3">
<a href="No.dc.html" style="background: #161A21; border: 1px solid {{k.border}}; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #E7EAF0">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-size: 15px; font-weight: 600">{{k.id}} {{k.title}}</span>
<span style="flex: none; font-size: 11px; font-weight: 600; color: {{k.tagColor}}">{{k.tag}}</span>
</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3ACBA">{{k.role}}</span>
<div style="height: 4px; border-radius: 2px; background: #2A313D; overflow: hidden"><div style="height: 4px; width: {{k.pct}}; background: {{k.tagColor}}"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #A3ACBA"><span>{{k.meta}}</span><span>{{k.cost}}</span></div>
</a>
</sc-for>
</main>
<div style="display: flex; justify-content: center; gap: 6px; padding: 6px 0 10px">
<sc-for list="{{cols}}" as="d" hint-placeholder-count="6">
<span style="width: 6px; height: 6px; border-radius: 3px; background: {{d.dot}}"></span>
</sc-for>
</div>
<nav aria-label="Navegação principal" style="display: flex; border-top: 1px solid #2A313D; background: #12151B">
<a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 16px; text-decoration: none; color: #A3ACBA; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h5l1.5 3h5l1.5-3h5"/><path d="M5.5 5h13L21 13v6H3v-6z"/></svg><span>Inbox · 5</span></a>
<a href="Projetos.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 16px; text-decoration: none; color: #A3ACBA; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Projetos</span></a>
<a href="Ativos.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 16px; text-decoration: none; color: #5EEAD4; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>Ativos</span></a>
<button type="button" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 16px; border: none; background: none; color: #A3ACBA; font: 500 11px Inter, sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>Mais</span></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { col: 2 };
}
renderVals() {
var blue = '#60A5FA', green = '#34D399', orange = '#FB923C', gray = '#6B7584', white = '#CBD5E1', violet = '#C4B5FD';
var data = [

]}
];
var self = this;

var cols = data.map(function (d, i) {

}
}
</script>
</body>
</html>
