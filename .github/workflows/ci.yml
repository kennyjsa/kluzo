name: ci

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two Go versions supported by the Go team (docs/architecture/stack.md).
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15
      - name: Architecture rules
        run: make arch
      - name: Tests
        run: make test
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make vuln
      - name: Build all platforms
        run: make dist
